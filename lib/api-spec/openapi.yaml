openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reports
    description: Transit issue reports
  - name: dashboard
    description: Department review dashboard
  - name: submissions
    description: Rider issue submissions and stored prototype responses
  - name: access
    description: Shared passcode access for the class-project app
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access/status:
    get:
      operationId: getAccessStatus
      tags: [access]
      summary: Check whether this browser has unlocked the app
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "503":
          description: App access code is not configured
  /access/unlock:
    post:
      operationId: unlockAccess
      tags: [access]
      summary: Unlock the app with its shared four-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessCodeInput"
      responses:
        "200":
          description: App unlocked for this browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "400":
          description: Invalid code format
        "401":
          description: Incorrect code
        "429":
          description: Too many incorrect attempts
        "503":
          description: App access code is not configured
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List transit issue reports
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, reviewing, assigned, resolved]
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransitReport"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a transit issue report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitReport"
  /reports/{id}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Get a report by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitReport"
        "404":
          description: Report not found
    patch:
      operationId: updateReportStatus
      tags: [reports]
      summary: Update report status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportStatusInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransitReport"
  /reports/stats:
    get:
      operationId: getReportStats
      tags: [dashboard]
      summary: Get report dashboard statistics
      responses:
        "200":
          description: Report statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStats"
  /reports/recent:
    get:
      operationId: getRecentReportActivity
      tags: [dashboard]
      summary: Get recent report activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportActivity"
  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List rider submissions, newest first
      responses:
        "200":
          description: Rider submissions in reverse chronological order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiderSubmission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Save a rider submission and its prototype response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiderSubmissionInput"
      responses:
        "201":
          description: Saved submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderSubmission"
components:
  schemas:
    SubmissionLanguage:
      type: string
      enum: [vi, en, es, pa]
    SubmissionDataSource:
      type: string
      enum: ["public dataset", "real document", "synthetic data"]
    RiderSubmissionInput:
      type: object
      properties:
        description:
          type: string
          maxLength: 1000
        language:
          $ref: "#/components/schemas/SubmissionLanguage"
        imageName:
          type: ["string", "null"]
          maxLength: 255
      required: [description, language, imageName]
    RiderSubmission:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        description:
          type: string
        language:
          $ref: "#/components/schemas/SubmissionLanguage"
        imageName:
          type: ["string", "null"]
        assistantResponse:
          type: string
        dataSource:
          $ref: "#/components/schemas/SubmissionDataSource"
        submittedAt:
          type: string
          format: date-time
      required: [id, reference, description, language, imageName, assistantResponse, dataSource, submittedAt]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccessCodeInput:
      type: object
      properties:
        passcode:
          type: string
          pattern: "^[0-9]{4}$"
      required: [passcode]
    AccessStatus:
      type: object
      properties:
        unlocked:
          type: boolean
      required: [unlocked]
    ReportStatus:
      type: string
      enum: [submitted, reviewing, assigned, resolved]
    ReportCategory:
      type: string
      enum: [delay, cleanliness, safety, accessibility, staff, vehicle, other]
    ReportAttachment:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [image, audio]
        name:
          type: string
        mimeType:
          type: string
        dataUrl:
          type: ["string", "null"]
      required: [id, kind, name, mimeType, dataUrl]
    TransitReport:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          $ref: "#/components/schemas/ReportCategory"
        route:
          type: string
        location:
          type: string
        happenedAt:
          type: string
        status:
          $ref: "#/components/schemas/ReportStatus"
        reporterName:
          type: string
        reporterContact:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ReportAttachment"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - reference
        - title
        - description
        - category
        - route
        - location
        - happenedAt
        - status
        - reporterName
        - reporterContact
        - attachments
        - createdAt
        - updatedAt
    ReportInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
          minLength: 10
        category:
          $ref: "#/components/schemas/ReportCategory"
        route:
          type: string
        location:
          type: string
        happenedAt:
          type: string
        reporterName:
          type: string
          minLength: 2
        reporterContact:
          type: ["string", "null"]
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ReportAttachment"
      required: [title, description, category, route, location, happenedAt, reporterName, attachments]
    ReportStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
      required: [status]
    ReportStats:
      type: object
      properties:
        total:
          type: integer
        submitted:
          type: integer
        reviewing:
          type: integer
        assigned:
          type: integer
        resolved:
          type: integer
        thisWeek:
          type: integer
        averageResponseHours:
          type: number
      required: [total, submitted, reviewing, assigned, resolved, thisWeek, averageResponseHours]
    ReportActivity:
      type: object
      properties:
        id:
          type: string
        reportId:
          type: string
        reference:
          type: string
        action:
          type: string
        detail:
          type: string
        createdAt:
          type: string
      required: [id, reportId, reference, action, detail, createdAt]

